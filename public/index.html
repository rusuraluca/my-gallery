<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>My Gallery</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css?v=11">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>My Gallery</h1>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <button class="nav-item active" data-view="all" id="nav-all">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3.5A1.5 1.5 0 013.5 2h9A1.5 1.5 0 0114 3.5v9a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 12.5v-9zM3.5 3a.5.5 0 00-.5.5v9a.5.5 0 00.5.5h9a.5.5 0 00.5-.5v-9a.5.5 0 00-.5-.5h-9z"/></svg>
            <span>All Photos</span>
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Years</div>
          <div id="years-list"></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="footer-btn" id="upload-btn" title="Upload photos">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h12a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/><path d="M7.646 1.146a.5.5 0 01.708 0l3 3a.5.5 0 01-.708.708L8.5 2.707V11.5a.5.5 0 01-1 0V2.707L5.354 4.854a.5.5 0 11-.708-.708l3-3z"/></svg>
          <span>Upload</span>
        </button>
        <button class="footer-btn" id="scan-btn" title="Rescan library">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 118 1a7 7 0 010 14zm0-1A6 6 0 108 2a6 6 0 000 12z"/><path d="M8 4a.5.5 0 01.5.5v3h3a.5.5 0 010 1h-3v3a.5.5 0 01-1 0v-3h-3a.5.5 0 010-1h3v-3A.5.5 0 018 4z"/></svg>
          <span>Rescan</span>
        </button>
        <button class="footer-btn" id="theme-btn" title="Toggle theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.5.5 0 01.5.5v2a.5.5 0 01-1 0v-2A.5.5 0 018 0zm0 13a.5.5 0 01.5.5v2a.5.5 0 01-1 0v-2A.5.5 0 018 13zm8-5a.5.5 0 01-.5.5h-2a.5.5 0 010-1h2a.5.5 0 01.5.5zM3 8a.5.5 0 01-.5.5h-2a.5.5 0 010-1h2A.5.5 0 013 8zm10.657-5.657a.5.5 0 010 .707l-1.414 1.415a.5.5 0 11-.707-.708l1.414-1.414a.5.5 0 01.707 0zm-9.193 9.193a.5.5 0 010 .707L3.05 13.657a.5.5 0 01-.707-.707l1.414-1.414a.5.5 0 01.707 0zm9.193 2.121a.5.5 0 01-.707 0l-1.414-1.414a.5.5 0 01.707-.707l1.414 1.414a.5.5 0 010 .707zM4.464 4.465a.5.5 0 01-.707 0L2.343 3.05a.5.5 0 11.707-.707l1.414 1.414a.5.5 0 010 .708z"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6 .278a.768.768 0 01.08.858 7.208 7.208 0 00-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 01.81.316.733.733 0 01-.031.893A8.349 8.349 0 018.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 016 .278z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-header">
        <h2 id="current-title">All Photos</h2>
        <span class="photo-count" id="photo-count"></span>
        <div class="header-actions">
          <button class="header-download" id="header-select" title="Select photos">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M14 1.5A1.5 1.5 0 0012.5 0h-9A1.5 1.5 0 002 1.5v13A1.5 1.5 0 003.5 16h9a1.5 1.5 0 001.5-1.5v-13zM5.7 11.3a.75.75 0 01-1.06-1.06l1.5-1.5a.75.75 0 011.06 0l3 3a.75.75 0 01-1.06 1.06L6.17 11.3H5.7z"/><path d="M5.7 7.3a.75.75 0 01-1.06-1.06l1.5-1.5a.75.75 0 011.06 0l3 3a.75.75 0 01-1.06 1.06L6.17 7.3H5.7z" opacity=".45"/></svg>
            <span>Select</span>
          </button>
          <button class="header-download" id="header-download" title="Download year as ZIP" hidden>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h12a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/><path d="M7.646 1.146a.5.5 0 01.708 0l3 3a.5.5 0 01-.708.708L8.5 2.707V11.5a.5.5 0 01-1 0V2.707L5.354 4.854a.5.5 0 11-.708-.708l3-3z"/></svg>
            <span>ZIP</span>
          </button>
        </div>
      </div>
      <div class="photo-grid" id="photo-grid"></div>
      <div class="loading" id="loading" hidden>
        <div class="spinner"></div>
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="12" width="48" height="40" rx="4"/><circle cx="22" cy="28" r="5"/><path d="M8 42l12-10 8 6 10-14 18 18"/></svg>
        <h3>No photos yet</h3>
        <p>Upload photos or put them in the <code>photos/</code> folder organized by year</p>
      </div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M4.707 3.293a1 1 0 00-1.414 1.414L8.586 10l-5.293 5.293a1 1 0 101.414 1.414L10 11.414l5.293 5.293a1 1 0 001.414-1.414L11.414 10l5.293-5.293a1 1 0 00-1.414-1.414L10 8.586 4.707 3.293z"/></svg>
    </button>
    <button class="lb-btn lb-info" id="lb-info" aria-label="Info">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M9 0a9 9 0 100 18A9 9 0 009 0zm1 13.5h-2v-7h2v7zm0-8.5h-2v-2h2v2z"/></svg>
    </button>
    <button class="lb-btn lb-delete" id="lb-delete" aria-label="Delete photo">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path d="M14.5 3a1 1 0 00-1-1h-2.38a1 1 0 00-.97.72L9.68 5H4a1 1 0 000 2h.5l.93 6.4A1.5 1.5 0 006.92 15h4.16a1.5 1.5 0 001.49-1.6L13.5 7H14a1 1 0 000-2h-.5l.34-1.28A1 1 0 0014.5 3zM5 7h8l-.83 5.6a.5.5 0 01-.5.4H6.92a.5.5 0 01-.5-.4L5 7z"/></svg>
    </button>
    <button class="lb-btn lb-share" id="lb-share" aria-label="Share photo">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8.5 1.5a.75.75 0 00-1.5 0v.93A4.001 4.001 0 002.5 6.38v.27a.75.75 0 001.5 0v-.27a2.5 2.5 0 014.5-1.5l.64.63.64-.63a2.5 2.5 0 014.5 1.5v4.24a2.5 2.5 0 01-4.5 1.5l-.64-.63-.64.63a2.5 2.5 0 01-4.5-1.5v-.9a.75.75 0 00-1.5 0v.9a4 4 0 007 2.62v-2.05l1.22 1.22a.75.75 0 101.06-1.06L11 7.19V4.43a4 4 0 00-2.5-2.93V1.5z"/></svg>
    </button>
    <button class="lb-btn lb-download" id="lb-download" aria-label="Download photo">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h12a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/><path d="M7.646 1.146a.5.5 0 01.708 0l3 3a.5.5 0 01-.708.708L8.5 2.707V11.5a.5.5 0 01-1 0V2.707L5.354 4.854a.5.5 0 11-.708-.708l3-3z"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>
    <div class="lb-image-wrap">
      <img id="lb-img" src="" alt="">
    </div>
  </div>

  <div class="info-panel" id="info-panel" hidden>
    <div class="info-header">
      <h3>Photo Info</h3>
      <button class="info-close" id="info-close" aria-label="Close info">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 4.646a.5.5 0 01.708 0L8 7.293l2.646-2.647a.5.5 0 01.708.708L8.707 8l2.647 2.646a.5.5 0 01-.708.708L8 8.707l-2.646 2.647a.5.5 0 01-.708-.708L7.293 8 4.646 5.354a.5.5 0 010-.708z"/></svg>
      </button>
    </div>
    <div class="info-body" id="info-body"></div>
  </div>

  <div class="modal-overlay" id="upload-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Upload Photos</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 4.646a.5.5 0 01.708 0L8 7.293l2.646-2.647a.5.5 0 01.708.708L8.707 8l2.647 2.646a.5.5 0 01-.708.708L8 8.707l-2.646 2.647a.5.5 0 01-.708-.708L7.293 8 4.646 5.354a.5.5 0 010-.708z"/></svg>
        </button>
      </div>
      <div class="upload-area" id="upload-area">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="10" width="36" height="28" rx="3"/><circle cx="17" cy="22" r="4"/><path d="M6 32l10-8 7 5 8-10 11 13"/></svg>
        <p>Drag photos here or</p>
        <button class="btn-primary" id="file-picker-btn">Choose Files</button>
        <input type="file" id="file-input" multiple accept="image/*" hidden>
      </div>
      <div class="upload-progress" id="upload-progress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-text" id="progress-text">Uploading...</span>
      </div>
    </div>
  </div>

  <div class="mobile-header" id="mobile-header">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span class="mobile-title" id="mobile-title">My Gallery</span>
    <button class="mobile-upload-btn" id="mobile-upload-btn" aria-label="Upload">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 01.5.5v2.5a1 1 0 001 1h12a1 1 0 001-1v-2.5a.5.5 0 011 0v2.5a2 2 0 01-2 2H2a2 2 0 01-2-2v-2.5a.5.5 0 01.5-.5z"/><path d="M7.646 1.146a.5.5 0 01.708 0l3 3a.5.5 0 01-.708.708L8.5 2.707V11.5a.5.5 0 01-1 0V2.707L5.354 4.854a.5.5 0 11-.708-.708l3-3z"/></svg>
    </button>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="select-bar" id="select-bar" hidden>
    <button class="select-bar-btn" id="select-all-btn">Select all</button>
    <span class="select-count" id="select-count">0 selected</span>
    <button class="select-bar-btn select-bar-cancel" id="select-cancel-btn">Cancel</button>
    <button class="select-bar-btn select-bar-danger" id="select-delete-btn" disabled>Delete</button>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/app.js?v=11"></script>
</body>
</html>
